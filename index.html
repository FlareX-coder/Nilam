<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AINS Reading Helper</title><style>:root{--p:#6526b8;--bg:#f6f2fb;--ok:#087f5b;--bad:#c0392b}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:#282332;padding-bottom:30px}header{background:linear-gradient(135deg,#512096,#7d35cb);color:#fff;padding:22px 16px}header h1{margin:0;font-size:20px}main{max-width:700px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #0001}h2{font-size:16px;color:var(--p)}label{display:block;font-size:13px;font-weight:bold;margin:10px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #d9d0e4;border-radius:10px;font-size:15px}textarea{min-height:110px}button{padding:13px 15px;border:0;border-radius:11px;font-weight:bold;font-size:15px;cursor:pointer}.primary{background:var(--p);color:#fff;width:100%}.secondary{background:#eee7f8;color:var(--p);margin-top:8px;width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.grid{grid-template-columns:1fr}}#results{display:none;margin-top:12px}.result{border:1px solid #e3d9ef;border-radius:12px;padding:12px;margin:8px 0}.result button{margin-top:8px;background:#eee7f8;color:var(--p);width:100%}.small,.result-info{font-size:12px;color:#666;line-height:1.5}.count{font-size:12px;margin-top:5px}.ok{color:var(--ok)}.bad{color:var(--bad)}.notice{background:#fff5d6;padding:11px;border-radius:10px;font-size:13px;line-height:1.45;margin-bottom:10px}</style></head><body><header><h1>📚 AINS Reading Helper</h1><p>Cari buku, semak maklumat dan salin ke AINS.</p></header><main><div class="card"><h2>🔎 Cari Buku</h2><label>Nama buku atau ISBN</label><input id="query" placeholder="Contoh: Harry Potter"><button class="primary" style="margin-top:10px" onclick="searchBook()">Cari Maklumat Buku</button><p class="small" id="searchStatus"></p><div id="results"></div></div><div class="card"><h2>📝 Maklumat untuk AINS</h2><div class="grid"><div><label>Kategori</label><input id="kategori" value="Buku"></div><div><label>Jenis Bahan</label><input id="jenis"></div></div><label>Bahasa</label><input id="bahasa"><label>Tajuk</label><input id="tajuk"><div class="grid"><div><label>Tahun Terbitan</label><input id="tahun"></div><div><label>Penulis</label><input id="penulis"></div></div><div class="grid"><div><label>Bilangan Mukasurat</label><input id="muka"></div><div><label>Penerbit</label><input id="penerbit"></div></div><label>Penilaian</label><select id="rating"><option>★★★★★</option><option>★★★★☆</option><option>★★★☆☆</option><option>★★☆☆☆</option><option>★☆☆☆☆</option></select></div><div class="card"><h2>📖 Rumusan & Pengajaran</h2><div class="notice">Teks automatik ialah bantuan sahaja. Sila semak berdasarkan bahan yang anda benar-benar baca. Minimum 100 aksara termasuk ruang.</div><label>Rumusan</label><textarea id="rumusan"></textarea><div id="rc" class="count"></div><label>Pengajaran</label><textarea id="pengajaran"></textarea><div id="pc" class="count"></div></div><div class="card"><h2>📋 Siap untuk Salin</h2><button class="primary" onclick="copyAll()">Salin Semua Maklumat</button><button class="secondary" onclick="copyField('rumusan')">Salin Rumusan Sahaja</button><button class="secondary" onclick="copyField('pengajaran')">Salin Pengajaran Sahaja</button></div></main><script>const $=id=>document.getElementById(id);function count(id,out){const n=$(id).value.length;$(out).innerHTML=n+' aksara — '+(n>=100?'<span class="ok">✓ cukup</span>':'<span class="bad">perlu 100+</span>')}$('rumusan').oninput=()=>count('rumusan','rc');$('pengajaran').oninput=()=>count('pengajaran','pc');count('rumusan','rc');count('pengajaran','pc');async function searchBook(){const q=$('query').value.trim();if(!q){$('searchStatus').textContent='Sila masukkan nama buku.';return}$('searchStatus').textContent='🔎 Mencari...';$('results').style.display='none';try{const r=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&limit=10');if(!r.ok)throw Error();const d=await r.json(),docs=d.docs||[];if(!docs.length){$('searchStatus').textContent='Tiada hasil.';return}$('searchStatus').textContent='✓ Jumpa '+docs.length+' hasil.';const box=$('results');box.innerHTML='';box.style.display='block';docs.forEach(doc=>{const x=document.createElement('div');x.className='result';x.innerHTML='<b>'+esc(doc.title||'Tiada tajuk')+'</b><br><span class="result-info">👤 '+esc((doc.author_name||['Tidak diketahui']).join(', '))+'<br>📅 '+esc(String(doc.first_publish_year||'Tidak diketahui'))+'</span><button>Pilih buku ini</button>';x.querySelector('button').onclick=()=>fillBook(doc);box.appendChild(x)})}catch(e){$('searchStatus').innerHTML='<span class="bad">❌ Carian gagal. Cuba refresh dan cari semula.</span>'}}function fillBook(doc){$('tajuk').value=doc.title||'';$('penulis').value=(doc.author_name||[]).join(', ');$('tahun').value=doc.first_publish_year||'';$('penerbit').value=(doc.publisher||[]).slice(0,2).join(', ');$('muka').value=doc.number_of_pages_median||'';const s=(doc.subject||[]).join(' ').toLowerCase();$('jenis').value=/(fiction|novel|fantasy|romance|mystery|adventure)/.test(s)?'Buku Fiksyen':'Buku Bukan Fiksyen';$('bahasa').value='Bahasa Inggeris';const topic=(doc.subject||[]).slice(0,8).join(', ')||'tema dan idea utama bahan ini';$('rumusan').value='Bahan ini membincangkan '+topic+'. Melalui pembacaan ini, pembaca dapat memahami isi utama, maklumat dan idea yang diketengahkan. Bahan ini juga membantu menambah pengetahuan serta memberikan pemahaman yang lebih baik tentang perkara yang dibincangkan.';$('pengajaran').value='Antara pengajaran yang boleh diambil ialah kita hendaklah rajin membaca dan sentiasa berusaha menambah ilmu pengetahuan. Kita juga perlu berfikir dengan teliti, membuat pilihan yang baik dan mengamalkan nilai-nilai positif dalam kehidupan. Pembacaan dapat membantu kita menjadi lebih berpengetahuan, bertanggungjawab dan matang.';count('rumusan','rc');count('pengajaran','pc');$('searchStatus').innerHTML='<span class="ok">✓ Buku dipilih. Rumusan dan pengajaran telah diisi.</span>';window.scrollTo({top:300,behavior:'smooth'})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function copyText(t,m){navigator.clipboard.writeText(t).then(()=>alert(m))}function copyField(id){copyText($(id).value,'Disalin!')}function copyAll(){copyText(`Kategori: ${$('kategori').value}\nJenis Bahan: ${$('jenis').value}\nBahasa: ${$('bahasa').value}\nTajuk: ${$('tajuk').value}\nTahun Terbitan: ${$('tahun').value}\nPenulis: ${$('penulis').value}\nBilangan Mukasurat: ${$('muka').value}\nPenerbit: ${$('penerbit').value}\nPenilaian: ${$('rating').value}\n\nRUMUSAN:\n${$('rumusan').value}\n\nPENGAJARAN:\n${$('pengajaran').value}`,'Semua maklumat disalin!')}$('query').addEventListener('keydown',e=>{if(e.key==='Enter')searchBook()});</script></body></html>
