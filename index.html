<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AINS Reading Helper</title>
<style>
:root{--p:#6526b8;--bg:#f6f2fb;--ok:#087f5b;--bad:#c0392b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#282332;padding-bottom:30px}header{background:linear-gradient(135deg,#512096,#7d35cb);color:#fff;padding:22px 16px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:20px}header p{margin:6px 0 0;font-size:13px;opacity:.9}main{max-width:700px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px rgba(0,0,0,.08)}h2{font-size:16px;color:var(--p);margin:0 0 12px}label{display:block;font-size:13px;font-weight:bold;margin:10px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #d9d0e4;border-radius:10px;font-size:15px;background:#fff}textarea{min-height:110px;line-height:1.45;resize:vertical}button{padding:13px 15px;border:0;border-radius:11px;font-weight:bold;font-size:15px;cursor:pointer}.primary{background:var(--p);color:#fff;width:100%}.secondary{background:#eee7f8;color:var(--p);margin-top:8px;width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.grid{grid-template-columns:1fr}}#results{display:none;margin-top:12px}.result{border:1px solid #e3d9ef;border-radius:12px;padding:12px;margin:8px 0}.result-title{font-weight:bold}.result-info{font-size:12px;color:#666;line-height:1.5;margin-top:4px}.result button{margin-top:8px;background:#eee7f8;color:var(--p);width:100%}.small{font-size:12px;color:#666;line-height:1.45}.count{font-size:12px;margin-top:5px}.ok{color:var(--ok)}.bad{color:var(--bad)}.notice{background:#fff5d6;padding:11px;border-radius:10px;font-size:13px;line-height:1.45;margin-bottom:10px}.source{display:inline-block;font-size:11px;background:#eee7f8;color:var(--p);padding:3px 7px;border-radius:20px;margin-top:6px}
</style>
</head>
<body>
<header><h1>📚 AINS Reading Helper</h1><p>Masukkan nama buku untuk mencari maklumat, kemudian salin ke AINS.</p></header>
<main>
<div class="card"><h2>🔎 Cari Buku</h2><label>Nama buku atau ISBN</label><input id="query" placeholder="Contoh: Harry Potter and the Philosopher's Stone" autocomplete="off"><button class="primary" style="margin-top:10px" onclick="searchBook()">Cari Maklumat Buku</button><p class="small" id="searchStatus"></p><div id="results"></div></div>
<div class="card"><h2>📝 Maklumat untuk AINS</h2><div class="grid"><div><label>Kategori</label><input id="kategori" value="Buku"></div><div><label>Jenis Bahan</label><input id="jenis" placeholder="Contoh: Buku Fiksyen"></div></div><label>Bahasa</label><input id="bahasa" placeholder="Contoh: Bahasa Inggeris"><label>Tajuk</label><input id="tajuk"><div class="grid"><div><label>Tahun Terbitan</label><input id="tahun" inputmode="numeric"></div><div><label>Penulis</label><input id="penulis"></div></div><div class="grid"><div><label>Bilangan Mukasurat</label><input id="muka" inputmode="numeric"></div><div><label>Penerbit</label><input id="penerbit"></div></div><label>Penilaian</label><select id="rating"><option>★★★★★</option><option>★★★★☆</option><option>★★★☆☆</option><option>★★☆☆☆</option><option>★☆☆☆☆</option></select></div>
<div class="card"><h2>📖 Rumusan & Pengajaran</h2><div class="notice">Masukkan atau semak teks berdasarkan bahan yang anda benar-benar baca. Minimum 100 aksara termasuk ruang.</div><label>Rumusan</label><textarea id="rumusan" placeholder="Rumusan bahan..."></textarea><div id="rc" class="count"></div><label>Pengajaran</label><textarea id="pengajaran" placeholder="Pengajaran daripada bahan..."></textarea><div id="pc" class="count"></div></div>
<div class="card"><h2>📋 Siap untuk Salin</h2><button class="primary" onclick="copyAll()">Salin Semua Maklumat</button><button class="secondary" onclick="copyField('rumusan')">Salin Rumusan Sahaja</button><button class="secondary" onclick="copyField('pengajaran')">Salin Pengajaran Sahaja</button></div>
</main>
<script>
const $=id=>document.getElementById(id);
function count(id,out){const n=$(id).value.length;$(out).innerHTML=n+' aksara — '+(n>=100?'<span class="ok">✓ cukup</span>':'<span class="bad">perlu 100+</span>')}
$('rumusan').oninput=()=>count('rumusan','rc');$('pengajaran').oninput=()=>count('pengajaran','pc');count('rumusan','rc');count('pengajaran','pc');

async function searchBook(){
 const q=$('query').value.trim();if(!q){$('searchStatus').innerHTML='<span class="bad">Sila masukkan nama buku atau ISBN.</span>';return}
 $('searchStatus').textContent='🔎 Mencari di Open Library...';$('results').style.display='none';$('results').innerHTML='';
 try{
  const url='https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&limit=10&fields=key,title,author_name,first_publish_year,publisher,number_of_pages_median,language,subject,isbn';
  const res=await fetch(url,{headers:{Accept:'application/json'}});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();const docs=data.docs||[];
  if(!docs.length){$('searchStatus').innerHTML='<span class="bad">❌ Tiada hasil.</span>';$('results').innerHTML='<div class="result"><b>Tiada buku dijumpai.</b><p class="small">Cuba nama buku yang lebih pendek, nama penulis, atau ISBN.</p></div>';$('results').style.display='block';return}
  showResults(docs);$('searchStatus').innerHTML=`✓ Jumpa ${docs.length} hasil daripada Open Library.`;
 }catch(e){console.error(e);$('searchStatus').innerHTML='<span class="bad">❌ Carian gagal.</span>';$('results').innerHTML='<div class="result"><b>Open Library tidak dapat dicapai.</b><p class="small">Pastikan internet aktif dan cuba lagi. Jika okey, cuba cari dengan tajuk buku yang lebih pendek.</p></div>';$('results').style.display='block'}
}
function showResults(docs){const box=$('results');box.innerHTML='';box.style.display='block';docs.forEach(doc=>{const d=document.createElement('div');d.className='result';d.innerHTML='<div class="result-title">'+escapeHTML(doc.title||'Tiada tajuk')+'</div><div class="result-info">👤 '+escapeHTML((doc.author_name||['Penulis tidak diketahui']).slice(0,3).join(', '))+'<br>📅 '+escapeHTML(String(doc.first_publish_year||'Tahun tidak diketahui'))+'<br>🏢 '+escapeHTML((doc.publisher||[]).slice(0,2).join(', ')||'Penerbit tidak diketahui')+'</div><span class="source">Open Library</span><button>Pilih buku ini</button>';d.querySelector('button').onclick=()=>fillBook(doc);box.appendChild(d)})}
function fillBook(v){$('tajuk').value=v.title||'';$('penulis').value=(v.author_name||[]).slice(0,5).join(', ');$('tahun').value=v.first_publish_year||'';$('penerbit').value=(v.publisher||[]).slice(0,2).join(', ');$('muka').value=v.number_of_pages_median||'';$('bahasa').value=languageName(v.language||[]);$('jenis').value=guessType(v.subject||[]);const subjects=(v.subject||[]).slice(0,8).join(', ');if(subjects){$('rumusan').value=('Bahan ini berkaitan dengan '+subjects+'. Bahan ini memberikan maklumat dan idea berkaitan dengan topik yang dibincangkan. Pembaca dapat memahami isi utama bahan melalui pembacaan yang teliti.').slice(0,700);count('rumusan','rc')}$('searchStatus').innerHTML='<span class="ok">✓ Buku dipilih.</span>';window.scrollTo({top:280,behavior:'smooth'})}
function languageName(x){const a=Array.isArray(x)?x:[x];const s=a.join(' ').toLowerCase();if(s.includes('eng'))return'Bahasa Inggeris';if(s.includes('may')||s.includes('msa'))return'Bahasa Melayu';if(s.includes('ind'))return'Bahasa Indonesia';if(s.includes('chi'))return'Bahasa Cina';if(s.includes('jpn'))return'Bahasa Jepun';if(s.includes('kor'))return'Bahasa Korea';return''}
function guessType(c){const s=c.join(' ').toLowerCase();return(s.includes('fiction')||s.includes('novel')||s.includes('fantasy')||s.includes('adventure')||s.includes('romance')||s.includes('mystery'))?'Buku Fiksyen':'Buku Bukan Fiksyen'}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function copyText(text,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>alert(msg||'Disalin!')).catch(()=>fallbackCopy(text,msg));else fallbackCopy(text,msg)}
function fallbackCopy(text,msg){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');alert(msg||'Disalin!')}catch(e){alert('Tak dapat salin automatik. Sila salin secara manual.')}document.body.removeChild(ta)}
function copyField(id){copyText($(id).value,'Disalin!')}
function copyAll(){const text=`Kategori: ${$('kategori').value}
Jenis Bahan: ${$('jenis').value}
Bahasa: ${$('bahasa').value}
Tajuk: ${$('tajuk').value}
Tahun Terbitan: ${$('tahun').value}
Penulis: ${$('penulis').value}
Bilangan Mukasurat: ${$('muka').value}
Penerbit: ${$('penerbit').value}
Penilaian: ${$('rating').value}

RUMUSAN:
${$('rumusan').value}

PENGAJARAN:
${$('pengajaran').value}`;copyText(text,'Semua maklumat disalin!')}
$('query').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchBook()}});
</script>
</body></html>
